<html>
    <head>
        <style>
            #glitchy-bjorn {
                width: 200px;
                height: 265px;
                border: 1px solid blue;
            }
            #bjorn {
                width: 200px;
                height: 265px;
                border: 1px solid red;
            }
        </style>
    </head>
    <body>
        <canvas id="glitchy-bjorn">

        </canvas>
        <img id="bjorn" src="./src/temp-bjorn.png" alt="Profile image of Björn">
        <script>
            function draw() {
                const canvas = document.getElementById("glitchy-bjorn")
                const ctx = canvas.getContext("2d")
                const img = new Image()
                img.src = "/src/temp-bjorn.png"
                img.addEventListener("load", (e) => {
                    ctx.drawImage(img, 0, 0, 200, 200)
                })
            }
                
            draw()

        </script>
    </body>
</html>
